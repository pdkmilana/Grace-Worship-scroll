<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GRACE WORSHIP — SCROLL</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-page="program">

  <header class="control-panel">
    <div class="top-row">
      <div class="brand-row">
        <a class="back-button" href="index.html" title="К программам" aria-label="К программам">←</a>
        <a class="brand brand-link" href="index.html">
          <div class="brand-name">GRACE WORSHIP</div>
          <div class="brand-subtitle">SCROLL</div>
        </a>
      </div>

      <div class="top-right">
        <button id="themeToggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему">🌙</button>
        <button id="editProgramButton" class="secondary-button hidden">Редактировать</button>
        <button id="authButton" class="secondary-button">Войти</button>
        <button id="logoutButton" class="secondary-button hidden">Выйти</button>
      </div>
    </div>

    <div class="controls-row">
      <div class="control-group">
        <span class="control-label">Размер</span>
        <div class="control-buttons">
          <button id="fontMinus" class="small-button" aria-label="Уменьшить размер текста">A−</button>
          <span id="fontSizeValue" class="value-display">22 px</span>
          <button id="fontPlus" class="small-button" aria-label="Увеличить размер текста">A+</button>
        </div>
      </div>

      <div class="control-group speed-control">
        <span class="control-label">Скорость</span>
        <div class="control-buttons">
          <button id="speedMinus" class="small-button" aria-label="Уменьшить скорость">−</button>
          <span id="globalSpeedValue" class="value-display">18</span>
          <button id="speedPlus" class="small-button" aria-label="Увеличить скорость">+</button>
          <button id="applySpeedAll" class="secondary-button compact">Применить ко всем</button>
        </div>
      </div>

      <div class="control-group playback">
        <button id="playButton" class="primary-button">▶︎ Начать</button>
        <button id="pauseButton" class="secondary-button">⏸︎ Пауза</button>
        <button id="resetButton" class="secondary-button">↺ Сначала</button>
      </div>
    </div>
  </header>

  <main class="page program-page">
    <section class="program-hero">
      <div>
        <div class="eyebrow">WORSHIP SET</div>
        <h1 id="programTitle">Загрузка программы…</h1>
        <p id="programInfo"></p>
      </div>

      <div class="program-actions">
        <button id="copyProgramLinkButton" class="secondary-button">Скопировать ссылку</button>
      </div>
    </section>

    <div id="songNavigation" class="song-navigation hidden">
      <button id="prevSongButton" class="nav-button" title="Предыдущая песня">↑</button>
      <div class="song-counter" id="songCounter">00 / 00</div>
      <button id="nextSongButton" class="nav-button" title="Следующая песня">↓</button>
    </div>

    <div id="programScroll" class="program-scroll" tabindex="0" aria-label="Прокручиваемая область песен">
      <section id="program"></section>

      <section id="emptyState" class="empty-state hidden">
      <h2>В этой программе пока нет песен</h2>
        <p>Ведущий может добавить песни через раздел редактирования.</p>
      </section>
    </div>
  </main>

  <div id="authModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-auth></div>

    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button id="closeAuthButton" class="modal-close" aria-label="Закрыть">×</button>
      <div class="eyebrow">ACCOUNT</div>
      <h2 id="authTitle">Вход</h2>
      <p class="modal-description">Войдите, чтобы редактировать программы служений.</p>

      <label>
        Email
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </label>

      <label>
        Пароль
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
      </label>

      <div class="auth-actions">
        <button id="loginButton" class="primary-button">Войти</button>
        <button id="signupButton" class="secondary-button">Регистрация</button>
      </div>

      <p id="authMessage" class="auth-message"></p>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
