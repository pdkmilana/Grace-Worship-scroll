<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GRACE WORSHIP — SCROLL</title>
  <link rel="stylesheet" href="style.css?v=9.3">
</head>
<body data-page="program">

  <header class="control-panel">
    <div class="top-row">
      <div class="brand-row">
        <a class="back-button" href="index.html" title="К программам" aria-label="К программам">←</a>
        <a class="brand brand-link" href="index.html">
          <div class="brand-name">GRACE WORSHIP</div>
          <div class="brand-subtitle">SCROLL</div>
        </a>
      </div>

      <div class="top-right">
        <button id="themeToggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему">🌙</button>
        <button id="editProgramButton" class="secondary-button hidden">Редактировать</button>
      </div>
    </div>

    <div class="controls-row">
      <div class="control-group">
        <span class="control-label">Размер</span>
        <div class="control-buttons">
          <button id="fontMinus" class="small-button" aria-label="Уменьшить размер текста">A−</button>
          <input id="fontSizeInput" class="value-input" type="number" inputmode="numeric" min="1" max="60" step="1" value="22" aria-label="Размер текста в пикселях">
          <button id="fontPlus" class="small-button" aria-label="Увеличить размер текста">A+</button>
        </div>
      </div>

      <div class="control-group speed-control">
        <span class="control-label">BPM</span>
        <div class="control-buttons">
          <button id="speedMinus" class="small-button" aria-label="Уменьшить BPM">−</button>
          <input id="globalSpeedInput" class="value-input" type="number" inputmode="numeric" min="40" max="180" step="1" value="80" aria-label="Темп песни в BPM">
          <button id="speedPlus" class="small-button" aria-label="Увеличить BPM">+</button>
          <button id="songSpeedButton" class="small-button speed-more-button" type="button" aria-label="BPM текущей песни" title="BPM текущей песни">⋯</button>
          <button id="applySpeedAll" class="secondary-button compact">Применить ко всем</button>
        </div>
      </div>

      <div class="control-group playback">
        <button id="playButton" class="primary-button">▶︎ Начать</button>
        <button id="pauseButton" class="secondary-button">⏸︎ Пауза</button>
        <button id="resetButton" class="secondary-button">↺ Сначала</button>
        <button id="continueButton" class="secondary-button">▶︎ Продолжить</button>
      </div>
    </div>
  </header>

  <div id="songSpeedPopover" class="song-speed-popover hidden" aria-hidden="true">
    <div class="song-speed-popover-title">BPM песни</div>
    <label class="song-speed-select-label" for="songSpeedSelect">Песня</label>
    <select id="songSpeedSelect" class="song-speed-select" aria-label="Выбрать песню для настройки скорости"></select>
    <div class="song-speed-popover-row">
      <button id="songSpeedMinus" class="small-button" type="button" aria-label="Уменьшить BPM песни">−</button>
      <input id="songSpeedInput" class="value-input" type="number" inputmode="numeric" min="40" max="180" step="1" value="80" aria-label="BPM текущей песни">
      <button id="songSpeedPlus" class="small-button" type="button" aria-label="Увеличить BPM песни">+</button>
    </div>
    <div class="song-speed-popover-actions">
      <button id="songSpeedSave" class="primary-button" type="button">Сохранить</button>
      <button id="songSpeedReset" class="secondary-button" type="button">Общая</button>
    </div>
  </div>

  <main class="page program-page">
    <section class="program-hero">
      <div>
        <div class="eyebrow">WORSHIP SET</div>
        <h1 id="programTitle">Загрузка программы…</h1>
      </div>


    </section>

    <div id="songNavigation" class="song-navigation hidden">
      <button id="prevSongButton" class="nav-button" title="Предыдущая песня">↑</button>
      <div class="song-counter" id="songCounter">00 / 00</div>
      <button id="nextSongButton" class="nav-button" title="Следующая песня">↓</button>
    </div>

    <div id="programScroll" class="program-scroll" aria-label="Песни программы">
      <section id="program"></section>

      <section id="emptyState" class="empty-state hidden">
      <h2>В этой программе пока нет песен</h2>
        <p>Ведущий может добавить песни через раздел редактирования.</p>
      </section>
    </div>
  </main>

  <div id="authModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-auth></div>

    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button id="closeAuthButton" class="modal-close" aria-label="Закрыть">×</button>
      <div class="eyebrow">ACCOUNT</div>
      <h2 id="authTitle">Вход</h2>
      <p class="modal-description">Войдите, чтобы редактировать программы служений.</p>

      <label>
        Email
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </label>

      <label>
        Пароль
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
      </label>

      <div class="auth-actions">
        <button id="loginButton" class="primary-button">Войти</button>
        <button id="signupButton" class="secondary-button">Регистрация</button>
      </div>

      <p id="authMessage" class="auth-message"></p>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=9.3"></script>
</body>
</html>
