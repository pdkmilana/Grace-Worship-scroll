<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>GRACE WORSHIP — SCROLL</title>
  <link rel="stylesheet" href="style.css?v=9.3">
</head>
<body data-page="home">

  <header class="simple-header">
    <div class="top-row">
      <a class="brand brand-link" href="index.html">
        <div class="brand-name">GRACE WORSHIP</div>
        <div class="brand-subtitle">SCROLL</div>
      </a>

      <div class="top-right">
        <button id="themeToggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему">🌙</button>
        <button id="authButton" class="secondary-button">Войти</button>
        <button id="logoutButton" class="secondary-button hidden">Выйти</button>
      </div>
    </div>
  </header>

  <main class="page home-page">
    <section class="home-hero">
      <div>
        <div class="eyebrow">WORSHIP SET</div>
        <h1>Программы служения</h1>
        <p>Выберите программу, чтобы открыть песни и аккорды.</p>
      </div>
    </section>

    <section class="programs-section">
      <div class="section-head">
        <div>
          <div class="section-kicker">PROGRAMS</div>
          <h2>Сохранённые программы</h2>
        </div>

        <button id="createProgramButton" class="primary-button hidden">
          ＋ Новое служение
        </button>
      </div>

      <div id="programList" class="program-list"></div>

      <div id="noPrograms" class="empty-state hidden">
        <h2>Программ пока нет</h2>
        <p>Войдите, чтобы создать первую программу служения.</p>
      </div>
    </section>
  </main>

  <div id="authModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-auth></div>

    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button id="closeAuthButton" class="modal-close" aria-label="Закрыть">×</button>

      <div class="eyebrow">ACCOUNT</div>
      <h2 id="authTitle">Вход</h2>
      <p class="modal-description">
        Войдите, чтобы создавать и редактировать программы служений.
      </p>

      <label>
        Email
        <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </label>

      <label>
        Пароль
        <input id="authPassword" type="password" autocomplete="current-password" placeholder="Минимум 6 символов">
      </label>

      <div class="auth-actions">
        <button id="loginButton" class="primary-button">Войти</button>
        <button id="signupButton" class="secondary-button">Регистрация</button>
      </div>

      <p id="authMessage" class="auth-message"></p>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=9.3"></script>
</body>
</html>
